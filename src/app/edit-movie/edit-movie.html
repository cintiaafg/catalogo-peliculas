<div class="container mt-4">

  <h2 class="text-white mb-4">
    ✏️ Editar Película
  </h2>

  <form (ngSubmit)="updateMovie()">

    <div class="mb-3">
      <label>Título</label>
      <input type="text"
      class="form-control"
      [(ngModel)]="movie.title"
      name="title">
    </div>

    <div class="mb-3">
      <label>Sinopsis</label>
      <textarea class="form-control"
      [(ngModel)]="movie.synopsis"
      name="synopsis"></textarea>
    </div>

    <div class="mb-3">
      <label>Año</label>
      <input type="number"
      class="form-control"
      [(ngModel)]="movie.year"
      name="year">
    </div>

    <button class="btn btn-warning">
      Actualizar película
    </button>

  </form>

</div>
