<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-white">🎬 Lista de Películas</h2>

    <a routerLink="/add-movie" class="btn btn-success">
      Agregar película
    </a>
  </div>

  <table class="table table-dark table-striped table-hover">

    <thead>
      <tr>
        <th>Identificación</th>
        <th>Título</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let movie of movies">
        <td>{{ movie.id }}</td>

        <td>
          <a [routerLink]="['/movie', movie.id]" class="text-white fw-bold">
            {{ movie.title }}
          </a>

    </tbody>

  </table>

</div>
