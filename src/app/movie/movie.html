<div class="container mt-4 text-white">

  <h2 class="mb-4">🎬 Detalle de película</h2>

  <div *ngIf="movie; else cargando" class="card bg-dark text-white shadow p-4">

    <div class="row">

      <div class="col-md-4">
        <img 
          [src]="movie.cover" 
          class="img-fluid rounded" 
          alt="Cover">
      </div>

      <div class="col-md-8">
        <h3>{{ movie.title }}</h3>

        <p><strong>Sinopsis:</strong> {{ movie.synopsis }}</p>
        <p><strong>Año:</strong> {{ movie.year }}</p>

        <a [routerLink]="['/edit-movie', movie.id]" class="btn btn-warning me-2">
          Editar
        </a>

        <button (click)="deleteMovie()" class="btn btn-danger me-2">
          Eliminar
        </button>

        <a routerLink="/movies" class="btn btn-secondary">
          Regresar al catálogo
        </a>
      </div>

    </div>

  </div>

  <ng-template #cargando>
    <p>Cargando película..</p>
  </ng-template>

</div>
