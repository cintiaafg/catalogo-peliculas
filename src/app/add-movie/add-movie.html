<div class="container mt-4 text-white">

  <h2>Agregar película</h2>

  <form (ngSubmit)="saveMovie()">

    <div class="mb-3">
      <label>Nombre de la película</label>
      <input type="text" class="form-control" [(ngModel)]="movie.title" name="title">
    </div>

    <div class="mb-3">
      <label>Sinopsis</label>
      <textarea class="form-control" [(ngModel)]="movie.synopsis" name="synopsis"></textarea>
    </div>

    <div class="mb-3">
      <label>URL del cover o imagen</label>
      <input type="text" class="form-control" [(ngModel)]="movie.cover" name="cover">
    </div>

    <div class="mb-3">
      <label>Año</label>
      <input type="number" class="form-control" [(ngModel)]="movie.year" name="year">
    </div>

    <button class="btn btn-success" type="submit">
      Guardar película
    </button>

    <a routerLink="/movies" class="btn btn-secondary ms-2">
      Cancelar
    </a>

  </form>

</div>
